version: "3"

vars:
  PROFILE: coverage.out
  RATCHET: coverage.ratchet
  COUNTS: coverage.counts.out

  # The module path, which every line of a well-formed profile begins with.
  MODULE:
    sh: go list -m

  # A profile line whose path is not in this module is a torn write, not a
  # package. -coverpkg makes six test binaries append to one file, and an
  # interleaved write has produced "gigithub.com/..." -- a duplicated "gi"
  # in one line of 22,140.
  #
  # UNCOVERED derives a package by string surgery on that path and validates
  # nothing, so a torn line invents a package and the gate fails on "a
  # package appearing": a real check, on fabricated input, reported as
  # something it is not. Checked separately so the message can say which.
  MALFORMED: >-
    awk -v module='{{.MODULE}}' 'NR > 1 && index($1, module "/") != 1 {
    printf "  line %d: %s\n", NR, $1 > "/dev/stderr"; torn++ }
    END { exit (torn > 0) }' {{.PROFILE}}
  # Uncovered statements per package, read out of the raw coverage profile.
  # A profile line is "import/path/file.go:span statements executions", and
  # the package is the directory the file sits in.
  #
  # Executions are summed per block before anything is called uncovered:
  # under -coverpkg every test binary instruments every package, so one
  # statement is reported by each binary that linked it, covered by the one
  # whose tests reach it and uncovered by the rest.
  #
  # A package with nothing uncovered still prints, at 0. Without that a
  # later regression would read as a package appearing rather than as a
  # count rising, and the message would name the wrong fault.
  #
  # An integer count, not a percentage: a percentage holds still while a
  # guarded branch adds one covered statement and one uncovered, and it
  # grows more forgiving as the repository grows.
  #
  # LC_ALL=C because the output is checked in here and compared on a Linux
  # runner, and the two collate a path separator differently.
  UNCOVERED: >-
    awk 'NR>1 { split($1,a,":"); n=split(a[1],p,"/"); d=p[1];
    for (i=2; i<n; i++) d = d "/" p[i];
    pkg[$1]=d; stmts[$1]=$2; runs[$1]+=$3; seen[d]=1 }
    END { for (b in runs) if (runs[b]==0) u[pkg[b]] += stmts[b];
    for (d in seen) print d, u[d]+0 }' {{.PROFILE}} | LC_ALL=C sort

tasks:
  default:
    desc: Run check + test + ratchet
    aliases: [all]
    cmds:
      - task: check
      - task: test
      - task: ratchet

  check:
    desc: Modernize gate + go mod tidy + prettier + go vet + golangci-lint (formatting included)
    cmds:
      - task: modernize
      - task: tidy
      - task: fmt:check:docs
      - task: vet
      - task: lint

  # Apply Go modernizations (min/max, range over int, new(value), etc.)
  # and fail if the working tree is no longer clean against HEAD for *.go.
  # This makes modernize signal mandatory rather than advisory.
  modernize:
    desc: Apply go fix and fail if it produced any changes
    cmds:
      - go fix ./...
      - |
        if ! git diff --quiet -- '*.go'; then
          echo ""
          echo "ERROR: go fix ./... produced changes. Review with 'git diff' and commit before continuing."
          echo "(If these changes are unrelated work-in-progress, stage them and re-run.)"
          git diff --stat -- '*.go'
          exit 1
        fi

  fmt:check:docs:
    desc: Check JSON and Markdown formatting with prettier
    cmds:
      - |
        if ! command -v prettier >/dev/null 2>&1; then
          echo "prettier not found: install it with 'brew install prettier'." >&2
          exit 1
        fi
        prettier --check . || {
          echo "prettier formatting check failed: run 'task fmt' to fix." >&2
          exit 1
        }

  fmt:
    desc: Format Go (gofumpt + goimports, via golangci-lint), JSON and Markdown with prettier
    cmds:
      - golangci-lint fmt ./...
      - prettier --write --log-level warn .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint, which also reports any formatting difference
    cmds:
      # First, because a malformed .golangci.yml otherwise surfaces as a
      # runtime linter error rather than a config error.
      - golangci-lint config verify
      - golangci-lint run ./...

  lint:fix:
    desc: Run golangci-lint with auto-fix
    cmds:
      - golangci-lint run --fix

  test:
    desc: Run all tests with race detector, writing a coverage profile
    # Once per invocation: `default` runs the suite and then `ratchet`,
    # which depends on it.
    run: once
    cmds:
      # -coverpkg because the packages are exercised across package lines:
      # the career and skill tables are driven by chargen's tests, and
      # chargen by the command's. Without it the profile counts only the
      # package under test.
      - go test -race -covermode=atomic -coverpkg=./... -coverprofile={{.PROFILE}} ./...

  ratchet:
    desc: Uncovered statements per package have not moved
    # A failure here is often not lost coverage. Blank lines split coverage
    # blocks, so a reflow or an extracted helper moves these counts without
    # changing what the tests reach. Read the named packages first.
    deps: [test]
    cmds:
      # diff carries the whole semantic, in both directions and for free: a
      # count that rose is coverage lost, one that fell is coverage to lock
      # in, and a package on one side only is one added or one gone.
      - |
        {{.MALFORMED}} || {
          echo "" >&2
          echo "{{.PROFILE}} is torn: the lines above are not paths in {{.MODULE}}." >&2
          echo "Re-run \`task test\` -- this is a write race, not a coverage change," >&2
          echo "and \`task ratchet:update\` would record the damage." >&2
          exit 1
        }
        {{.UNCOVERED}} > {{.COUNTS}}
        grep -v '^#' {{.RATCHET}} | diff - {{.COUNTS}} || {
          echo "" >&2
          echo "coverage moved. If that was deliberate: task ratchet:update" >&2
          exit 1
        }
        echo "ratchet holds: $(wc -l < {{.COUNTS}} | tr -d ' ') packages"

  ratchet:update:
    desc: Record the current uncovered-statement counts
    deps: [test]
    cmds:
      # The header is stripped before the comparison, so it is prose for a
      # reader of the file rather than part of what is held.
      - |
        {{.MALFORMED}} || {
          echo "" >&2
          echo "{{.PROFILE}} is torn: the lines above are not paths in {{.MODULE}}." >&2
          echo "Refusing to write {{.RATCHET}} from it. Re-run \`task test\`." >&2
          exit 1
        }
        {
          echo "# Uncovered statements per package. The gate fails in both directions:"
          echo "# a number that rises is lost coverage, one that falls is coverage to lock in."
          echo "# Regenerate with: task ratchet:update"
          {{.UNCOVERED}}
        } > {{.RATCHET}}

  # Deliberately not part of `task`. The gate runs each fuzz target's seed
  # corpus, which costs microseconds and is what keeps a target honest as
  # the code moves; the fuzzing engine itself is a search, and a search
  # with a time limit belongs to whoever chose the limit.
  #
  # Seeds are small on purpose. Seeding these from chargen/testdata, whose
  # records run to ~220KB, drops the engine from millions of executions to
  # eighteen: mutating an input that size costs more than the code it is
  # testing. docs/character.minimal.json is 732 bytes and reaches the same
  # paths.
  fuzz:
    desc: Run each fuzz target's engine (default 30s each; FUZZTIME=2m to extend)
    vars:
      FUZZTIME: '{{.FUZZTIME | default "30s"}}'
    cmds:
      - go test -run '^$' -fuzz FuzzValidateUWP -fuzztime {{.FUZZTIME}} ./world/
      - go test -run '^$' -fuzz FuzzEhexRoundTrip -fuzztime {{.FUZZTIME}} ./world/
      - go test -run '^$' -fuzz FuzzRenderMalformedRecord -fuzztime {{.FUZZTIME}} ./render/
      - go test -run '^$' -fuzz FuzzReplayMalformedRecord -fuzztime {{.FUZZTIME}} ./chargen/

  # The fixtures under chargen/testdata and render/testdata are the
  # engine's own output, compared byte for byte. Regenerating them is a
  # deliberate act: run this only when a change was meant to move them,
  # and read the diff before committing it.
  #
  # The package list is explicit because -update is defined per test
  # package: `go test ./... -update` fails in every package that does not
  # declare the flag. Add any new package that declares it here too, or
  # its fixtures go unregenerated and the gate below fails against them.
  goldens:
    desc: Rewrite the golden fixtures, then run the full gate
    cmds:
      - go test ./chargen ./render -update
      - task: default

  citations:
    desc: Check ERRATA.md's quotations against the printed rules (needs the private Book 1 PDF)
    vars:
      RULES: '{{.T5_RULES_PDF | default "$HOME/Documents/Traveller/T5/Traveller5 Core Rules Book 1 Characters and Combat.pdf"}}'
    cmds:
      # Skipped, not failed, where the PDF is absent: the rules are a
      # purchased artifact this repository does not redistribute, so the
      # gate cannot run in CI and does not run in `task`.
      - T5_RULES_PDF="{{.RULES}}" go test -count=1 -run TestEveryQuotationIsOnThePageItCites -v ./audit

  tidy:
    desc: go.mod is current
    cmds:
      - go mod tidy -diff

  deps:
    desc: Install the development toolchain from the Brewfile
    cmds:
      - brew bundle --file=Brewfile

  hooks:
    desc: Install git hooks (point core.hooksPath at the tracked .githooks/)
    cmds:
      - git config core.hooksPath .githooks
      - echo "git hooks installed — pre-push runs 'task' (check + test)"
