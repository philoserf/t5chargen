version: "2"

# Note: gofumpt is enforced by the `task check` recipe via the gofumpt CLI,
# not by golangci-lint's bundled gofumpt (the CLI is the single source of
# truth for formatting); golangci-lint stays focused on lint checks.

run:
  timeout: 5m

linters:
  default: all
  settings:
    errcheck:
      exclude-functions: # CLI diagnostics to injected writers; a failed usage/error print is not actionable
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/philoserf/t5chargen # the module's own packages
    tagliatelle:
      case:
        rules:
          json: snake # the PRD's JSON conventions use snake_case (schema_version, policy_version, ...)
  disable:
    # Superseded in place. `default: all` turns on a deprecated linter and
    # its replacement together, so each pair runs twice and warns about
    # itself; the old one is switched off and the new one left on. Both
    # replacements pass at their own defaults, so the settings
    # golangci-lint suggests for reproducing the old behaviour are not
    # carried over — they would be configuration nothing needs.
    - wsl # replaced by wsl_v5 (deprecated since golangci-lint v2.2.0)
    - gomodguard # replaced by gomodguard_v2 (deprecated since v2.12.0)
    - exhaustruct # T5 chart data and partial struct inits in tests are intentional
    - exhaustruct_v5 # same rationale as exhaustruct: partial event/record inits are the norm
    - mnd # the codebase transcribes Book 1 charts (magic numbers by nature)
    - goconst # domain vocabulary (career/skill names) repeated across files, not consts
    - varnamelen # terse notation vars (C1..C6, xD) mirror the book's own notation
    - gochecknoglobals # embedded chart data are intentional package-level vars
    - noinlineerr # `if err := f(); err != nil` is standard Go
    - paralleltest # ~0 benefit on fast deterministic tests; huge manual churn
